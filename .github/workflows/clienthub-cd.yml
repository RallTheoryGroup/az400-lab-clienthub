name: ClientHub controlled delivery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clienthub-slots
  cancel-in-progress: false
env:
  WEBAPP: clienthub-lab-z80b7
  RG: rg-ralltheory-digital
  RELEASE_VERSION: '3.2.2'
  PREVIOUS_VERSION: '3.1.0'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish immutable candidate
        working-directory: RallTheoryGroup/src/digital-services/clienthub/src/ClientHub
        run: |
          dotnet publish -c Release -p:Version="$RELEASE_VERSION" -o publish
          cd publish
          zip -qr ../clienthub.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: clienthub-package
          path: RallTheoryGroup/src/digital-services/clienthub/src/ClientHub/clienthub.zip
  stage:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clienthub-package
          path: package
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy and check staging
        run: |
          az webapp deploy --name "$WEBAPP" --resource-group "$RG" --slot staging \
            --src-path package/clienthub.zip --type zip --output none
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 20 \
                 "https://${WEBAPP}-staging.azurewebsites.net/health" &&
               curl --fail --silent --show-error --max-time 20 \
                 "https://${WEBAPP}-staging.azurewebsites.net/version" \
                 | grep -F "\"version\":\"${RELEASE_VERSION}\""; then
              exit 0
            fi
            sleep 10
          done
          echo "Staging did not serve ${RELEASE_VERSION} after deployment." >&2
          exit 1
      - name: Verify deployed ClientHub and record release
        env:
          APP_RG: ${{ env.RG }}
          APP_NAME: ${{ env.WEBAPP }}
          SLOT: staging
          AI_ID: ${{ vars.APPINSIGHTS_RESOURCE_ID }}
          BUILD_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          host=$(az webapp show -g "$APP_RG" -n "$APP_NAME" --slot "$SLOT" --query defaultHostName -o tsv)
          healthy=false
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 10 "https://$host/health"; then
              healthy=true
              break
            fi
            sleep 10
          done
          [ "$healthy" = true ] || { echo "Deployment health check failed"; exit 1; }
          annotation_id=$(python -c 'import uuid; print(uuid.uuid4())')
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          properties=$(jq -nc --arg build "$BUILD_ID" --arg commit "$COMMIT" --arg slot "$SLOT" \
            '{BuildId:$build,Commit:$commit,Slot:$slot}')
          body=$(jq -nc --arg id "$annotation_id" --arg time "$timestamp" --arg props "$properties" \
            '{Id:$id,AnnotationName:"ClientHub deployment",EventTime:$time,Category:"Deployment",Properties:$props}')
          az rest --method put \
            --url "https://management.azure.com${AI_ID}/Annotations?api-version=2015-05-01" \
            --body "$body" --output none

  promote:
    needs: stage
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Check rollback baseline and candidate
        run: |
          curl --fail --silent --show-error "https://${WEBAPP}.azurewebsites.net/version" \
            | grep -F "\"version\":\"${PREVIOUS_VERSION}\""
          curl --fail --silent --show-error "https://${WEBAPP}-staging.azurewebsites.net/version" \
            | grep -F "\"version\":\"${RELEASE_VERSION}\""
      - name: Swap after approval
        id: swap
        run: |
          az webapp traffic-routing set --name "$WEBAPP" --resource-group "$RG" \
            --distribution staging=0 --output none
          az webapp deployment slot swap --name "$WEBAPP" --resource-group "$RG" \
            --slot staging --target-slot production --output none
      - name: Verify production
        run: |
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 10 --max-time 20 "https://${WEBAPP}.azurewebsites.net/health"
          curl --fail --silent --show-error "https://${WEBAPP}.azurewebsites.net/version" \
            | grep -F "\"version\":\"${RELEASE_VERSION}\""
      - name: Restore baseline after confirmed swap
        if: ${{ failure() && steps.swap.outcome == 'success' }}
        run: |
          az webapp deployment slot swap --name "$WEBAPP" --resource-group "$RG" \
            --slot staging --target-slot production --output none
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 10 --max-time 20 "https://${WEBAPP}.azurewebsites.net/health"
          curl --fail --silent --show-error "https://${WEBAPP}.azurewebsites.net/version" \
            | grep -F "\"version\":\"${PREVIOUS_VERSION}\""
