trigger: none
pr: none
lockBehavior: sequential
variables:
  webApp: clienthub-lab-z80b7
  resourceGroup: rg-ralltheory-digital
  releaseVersion: '3.2.2'
  previousVersion: '3.1.0'
  appResourceGroup: rg-ralltheory-digital
  appServiceName: clienthub-lab-z80b7
  slotName: staging
  appInsightsName: ai-ralltheory-qwh5vxpgarqhg
  monitorResourceGroup: rg-ralltheory-shared
  candidateHost: clienthub-lab-z80b7-staging.azurewebsites.net
  # appInsightsResourceId is defined in the pipeline settings (keeps the subscription ID out of this public repo).
stages:
- stage: Build
  jobs:
  - job: Package
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: '8.0.x'
    - bash: |
        set -euo pipefail
        dotnet publish -c Release -p:Version="$(releaseVersion)" -o publish
        cd publish
        zip -qr "$(Build.ArtifactStagingDirectory)/clienthub.zip" .
      workingDirectory: RallTheoryGroup/src/digital-services/clienthub/src/ClientHub
    - publish: $(Build.ArtifactStagingDirectory)/clienthub.zip
      artifact: clienthub-package
- stage: Stage
  dependsOn: Build
  jobs:
  - deployment: StageClientHub
    pool:
      vmImage: ubuntu-latest
    environment: clienthub-staging
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: clienthub-package
          - task: AzureCLI@2
            inputs:
              azureSubscription: clienthub-wif
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az webapp deploy --name "$(webApp)" --resource-group "$(resourceGroup)" \
                  --slot staging --src-path "$(Pipeline.Workspace)/clienthub-package/clienthub.zip" \
                  --type zip --output none
                for _ in $(seq 1 30); do
                  if curl --fail --silent --show-error --max-time 20 \
                       "https://$(webApp)-staging.azurewebsites.net/health" &&
                     curl --fail --silent --show-error --max-time 20 \
                       "https://$(webApp)-staging.azurewebsites.net/version" \
                       | grep -F '"version":"$(releaseVersion)"'; then
                    exit 0
                  fi
                  sleep 10
                done
                echo "Staging did not serve $(releaseVersion) after deployment." >&2
                exit 1
          - task: AzureCLI@2
            displayName: Verify deployed ClientHub and record release
            inputs:
              azureSubscription: clienthub-wif
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                host=$(az webapp show -g "$APP_RG" -n "$APP_NAME" --slot "$SLOT" --query defaultHostName -o tsv)
                healthy=false
                for attempt in 1 2 3 4 5; do
                  if curl --fail --silent --show-error --max-time 10 "https://$host/health"; then
                    healthy=true
                    break
                  fi
                  sleep 10
                done
                [ "$healthy" = true ] || { echo "Deployment health check failed"; exit 1; }
                annotation_id=$(python -c 'import uuid; print(uuid.uuid4())')
                timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                properties=$(jq -nc --arg build "$BUILD_ID" --arg commit "$COMMIT" --arg slot "$SLOT" \
                  '{BuildId:$build,Commit:$commit,Slot:$slot}')
                body=$(jq -nc --arg id "$annotation_id" --arg time "$timestamp" --arg props "$properties" \
                  '{Id:$id,AnnotationName:"ClientHub deployment",EventTime:$time,Category:"Deployment",Properties:$props}')
                az rest --method put \
                  --url "https://management.azure.com${AI_ID}/Annotations?api-version=2015-05-01" \
                  --body "$body" --output none
            env:
              APP_RG: $(appResourceGroup)
              APP_NAME: $(appServiceName)
              SLOT: $(slotName)
              AI_ID: $(appInsightsResourceId)
              BUILD_ID: $(Build.BuildId)
              COMMIT: $(Build.SourceVersion)
- stage: CandidateHealth
  dependsOn: Stage
  condition: succeeded()
  jobs:
  - job: ObserveCandidate
    pool: server
    steps:
    - task: Delay@1
      displayName: Observation period (generate candidate traffic now)
      inputs:
        delayForMinutes: '15'
  - job: CheckCandidateHealth
    dependsOn: ObserveCandidate
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: none
    - task: AzureCLI@2
      displayName: Check candidate checkout health
      inputs:
        azureSubscription: clienthub-wif
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          az extension add --name application-insights --only-show-errors
          pass=$(az monitor app-insights query \
            --app "$(appInsightsName)" --resource-group "$(monitorResourceGroup)" \
            --analytics-query '
              requests
              | where timestamp between (ago(12m) .. ago(2m))
              | where url contains "/lab/checkout"
              | where tostring(parse_url(url).Host) =~ "$(candidateHost)"
              | summarize Total=sum(itemCount),
                          Failed=sumif(itemCount, success == false),
                          P95Ms=percentile(duration,95)
              | extend Pass=Total >= 20 and Failed == 0 and P95Ms < 1000
              | project Pass' \
            --query 'tables[0].rows[0][0]' -o tsv)
          if [ "$pass" != "true" ] && [ "$pass" != "True" ]; then
            echo "Candidate unhealthy, insufficient data, or unexpected response; promotion blocked."
            exit 1
          fi
- stage: Promote
  dependsOn: CandidateHealth
  condition: succeeded()
  jobs:
  - deployment: PromoteClientHub
    pool:
      vmImage: ubuntu-latest
    environment: clienthub-production
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: clienthub-wif
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                curl --fail --silent --show-error "https://$(webApp).azurewebsites.net/version" \
                  | grep -F '"version":"$(previousVersion)"'
                curl --fail --silent --show-error "https://$(webApp)-staging.azurewebsites.net/version" \
                  | grep -F '"version":"$(releaseVersion)"'
                az webapp traffic-routing set --name "$(webApp)" --resource-group "$(resourceGroup)" \
                  --distribution staging=0 --output none
                az webapp deployment slot swap --name "$(webApp)" --resource-group "$(resourceGroup)" \
                  --slot staging --target-slot production --output none
                if curl --fail --silent --show-error --retry 10 --retry-all-errors \
                    --retry-delay 10 --max-time 20 "https://$(webApp).azurewebsites.net/health" &&
                   curl --fail --silent --show-error "https://$(webApp).azurewebsites.net/version" \
                    | grep -F '"version":"$(releaseVersion)"'; then
                  echo "Candidate verified"
                else
                  az webapp deployment slot swap --name "$(webApp)" --resource-group "$(resourceGroup)" \
                    --slot staging --target-slot production --output none
                  curl --fail --silent --show-error "https://$(webApp).azurewebsites.net/version" \
                    | grep -F '"version":"$(previousVersion)"'
                  exit 1
                fi
